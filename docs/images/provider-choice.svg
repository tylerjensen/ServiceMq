<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Storage provider decision guide</title><desc id="desc">Choose memory for disposable data, file for simple inspectable durability, SQLite for indexed transactional local storage, or custom for an application-owned backend.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker><style>.h{font:700 18px system-ui,sans-serif;fill:#0f172a}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#475569}.b{stroke-width:2;rx:14}.l{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="900" height="430" rx="24" fill="#f8fafc"/>
  <rect x="330" y="25" width="240" height="68" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="66" text-anchor="middle" class="h">Must survive restart?</text>
  <rect x="55" y="150" width="220" height="90" class="b" fill="#ede9fe" stroke="#7c3aed"/><text x="165" y="185" text-anchor="middle" class="h">Memory</text><text x="165" y="209" text-anchor="middle" class="s">tests · transient workflows</text><text x="165" y="229" text-anchor="middle" class="s">fast, intentionally disposable</text>
  <rect x="340" y="150" width="220" height="90" class="b" fill="#fef3c7" stroke="#d97706"/><text x="450" y="185" text-anchor="middle" class="h">Local durability</text><text x="450" y="209" text-anchor="middle" class="s">one owning process</text><text x="450" y="229" text-anchor="middle" class="s">choose an operational shape</text>
  <rect x="625" y="150" width="220" height="90" class="b" fill="#e0f2fe" stroke="#0284c7"/><text x="735" y="185" text-anchor="middle" class="h">Custom</text><text x="735" y="209" text-anchor="middle" class="s">application-owned backend</text><text x="735" y="229" text-anchor="middle" class="s">implement IMessageStore</text>
  <rect x="250" y="315" width="200" height="80" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="350" y="347" text-anchor="middle" class="h">File</text><text x="350" y="371" text-anchor="middle" class="s">simple · inspectable</text>
  <rect x="500" y="315" width="200" height="80" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="347" text-anchor="middle" class="h">SQLite</text><text x="600" y="371" text-anchor="middle" class="s">indexed · transactional</text>
  <path d="M330 59H165v86" class="l"/><text x="235" y="50" class="s">no</text><path d="M450 93v52" class="l"/><text x="460" y="126" class="s">yes</text><path d="M570 59h165v86" class="l"/><text x="660" y="50" class="s">external requirements</text>
  <path d="M420 240l-55 70" class="l"/><text x="330" y="286" class="s">transparent files</text><path d="M480 240l95 70" class="l"/><text x="536" y="286" class="s">queryable state</text>
</svg>
