<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">ServiceMq transport choices</title><desc id="desc">Named pipes connect processes on one host, TCP connects hosts across a trusted network, and a dual endpoint can use either.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>.h{font:700 18px system-ui,sans-serif;fill:#0f172a}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#475569}.b{stroke-width:2;rx:14}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="920" height="390" rx="24" fill="#f8fafc"/><text x="460" y="38" text-anchor="middle" class="h">Choose the transport from the deployment boundary</text>
  <rect x="45" y="75" width="250" height="230" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="108" text-anchor="middle" class="h">One host</text><rect x="75" y="135" width="190" height="55" class="b" fill="#fff" stroke="#60a5fa"/><text x="170" y="168" text-anchor="middle" class="t">Process A</text><rect x="75" y="225" width="190" height="55" class="b" fill="#fff" stroke="#60a5fa"/><text x="170" y="258" text-anchor="middle" class="t">Process B</text><path d="M170 190v30" class="l"/><text x="180" y="213" class="s">named pipe</text>
  <rect x="335" y="75" width="250" height="230" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="460" y="108" text-anchor="middle" class="h">Trusted network</text><rect x="365" y="135" width="190" height="55" class="b" fill="#fff" stroke="#4ade80"/><text x="460" y="168" text-anchor="middle" class="t">Host A</text><rect x="365" y="225" width="190" height="55" class="b" fill="#fff" stroke="#4ade80"/><text x="460" y="258" text-anchor="middle" class="t">Host B</text><path d="M460 190v30" class="l"/><text x="470" y="213" class="s">TCP</text>
  <rect x="625" y="75" width="250" height="230" class="b" fill="#ede9fe" stroke="#7c3aed"/><text x="750" y="108" text-anchor="middle" class="h">Flexible topology</text><rect x="655" y="135" width="190" height="55" class="b" fill="#fff" stroke="#a78bfa"/><text x="750" y="168" text-anchor="middle" class="t">Dual endpoint</text><path d="M750 190v45M750 235l-65 40M750 235l65 40" class="l"/><text x="675" y="296" class="s">pipe</text><text x="815" y="296" class="s">TCP</text>
  <text x="460" y="352" text-anchor="middle" class="s">TCP requires a private network or authenticated encrypted tunnel when messages are sensitive.</text>
</svg>
