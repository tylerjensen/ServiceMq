name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check-nuget-key:
    name: Check NUGET_API_KEY
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.defined }}
    steps:
      - id: check
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # Job-level `if` cannot read secrets, so detect presence here and gate
        # the publish job via `needs` output. Keeps the workflow inert on repos
        # where the key is not configured (e.g. upstream).
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build, pack and push ServiceMq.SharpCoreDb
    runs-on: ubuntu-latest
    needs: check-nuget-key
    if: needs.check-nuget-key.outputs.has-key == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack ServiceMq.SharpCoreDb
        run: dotnet pack src/ServiceMq.SharpCoreDb/ServiceMq.SharpCoreDb.csproj -c Release -o artifacts --nologo

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          package=(artifacts/*.nupkg)
          echo "Publishing ${#package[@]} package(s)"
          dotnet nuget push "${package[@]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

