name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  check-nuget-key:
    name: Check NUGET_API_KEY
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.defined }}
    steps:
      - id: check
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # Job-level `if` cannot read secrets, so detect presence here and gate
        # the publish job via `needs` output. Keeps the workflow inert on repos
        # where the key is not configured (e.g. upstream).
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Test, pack and push ServiceMq packages
    runs-on: ubuntu-latest
    needs: check-nuget-key
    if: needs.check-nuget-key.outputs.has-key == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test src/ServiceMq.slnx -c Release --nologo

      - name: Pack all providers and core
        run: |
          dotnet pack src/ServiceMq/ServiceMq.csproj -c Release -o artifacts --nologo
          dotnet pack src/ServiceMq.Sqlite/ServiceMq.Sqlite.csproj -c Release -o artifacts --nologo
          dotnet pack src/ServiceMq.SharpCoreDb/ServiceMq.SharpCoreDb.csproj -c Release -o artifacts --nologo

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          package=(artifacts/*.nupkg)
          echo "Publishing ${#package[@]} package(s)"
          for item in "${package[@]}"; do
            dotnet nuget push "$item" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

