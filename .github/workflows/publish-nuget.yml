name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    name: Build, pack and push ServiceMq.SharpCoreDb
    runs-on: ubuntu-latest
    # Only run where the NuGet API key secret is configured (currently the fork).
    if: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack ServiceMq.SharpCoreDb
        run: dotnet pack src/ServiceMq.SharpCoreDb/ServiceMq.SharpCoreDb.csproj -c Release -o artifacts --nologo

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          package=(artifacts/*.nupkg)
          echo "Publishing ${#package[@]} package(s)"
          dotnet nuget push "${package[@]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
